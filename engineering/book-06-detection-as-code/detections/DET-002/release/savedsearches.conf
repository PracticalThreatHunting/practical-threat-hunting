[DET-002 - Book 6 reference]
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.digest_mode = 0
actions =
search = search index=detection_factory sourcetype="detection_factory:logical:v1" earliest=-30m latest=now | eval Evaluation=now() | where quality="valid" AND schema_version=1     AND event_time>=Evaluation-1800 AND event_time<Evaluation     AND ingest_time<=Evaluation | eventstats dc(payload_hash) AS HashCount BY tenant source_kind event_id | where HashCount=1 | sort 0 ingest_time | dedup tenant source_kind event_id | eval EventRef=tenant."|".source_kind."|".event_id | where source_kind="identity" AND action="auth_denied"     AND outcome="failure" | eval bucket_start=floor(event_time/300)*300 | where bucket_start+300<=Evaluation | stats count AS event_count min(event_time) AS first_event_time     max(event_time) AS last_event_time values(EventRef) AS event_refs     BY tenant principal bucket_start | where event_count>=3 | eval signal_key="DET-002|".tenant."|".principal."|".bucket_start  | eval detection_id="DET-002", version="1.0.0", mode="complete",     severity="medium", confidence="observed-contract-match" | eval count=event_count | table detection_id version signal_key tenant principal     first_event_time last_event_time event_refs mode severity confidence count bucket_start
